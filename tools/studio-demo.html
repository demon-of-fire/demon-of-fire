<main id="main-content"><div class="container"><header class="project-hero"><p class="label">Accessible Studio</p><h1>Studio</h1><p>Preview images and make basic adjustments. Free, open source, no install required.</p></header>
<section aria-labelledby="studio-app-heading" class="studio-app">
<h2 id="studio-app-heading">Studio – Image Preview</h2>
<div class="studio-wrapper" role="region" aria-label="Image editing area">
  <label for="studio-file">Image</label>
  <input type="file" id="studio-file" accept="image/*">
  <img id="studio-preview" class="studio-preview" alt="Preview image" style="max-width:100%; border:1px solid #ddd; margin:1rem 0; display:none;">
  
  <div class="studio-controls">
    <div class="control-group">
      <label for="studio-brightness">Brightness</label>
      <input type="range" id="studio-brightness" min="50" max="150" value="100">
      <span id="studio-brightness-val">100%</span>
    </div>
    <div class="control-group">
      <label for="studio-contrast">Contrast</label>
      <input type="range" id="studio-contrast" min="50" max="150" value="100">
      <span id="studio-contrast-val">100%</span>
    </div>
  </div>
</div>
</section>
<p class="section-action"><a href="../../apps/accessible-studio.html" class="btn btn-block">Download Full Studio App →</a></p>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const fileInput = $('#studio-file');
  const preview = $('#studio-preview');
  const brightness = $('#studio-brightness');
  const contrast = $('#studio-contrast');
  const brightnessVal = $('#studio-brightness-val');
  const contrastVal = $('#studio-contrast-val');
  
  fileInput.onchange = e => {
    const f = e.target.files[0];
    if(f) {
      const url = URL.createObjectURL(f);
      preview.src = url;
      preview.style.display = 'block';
    }
  };
  
  brightness.oninput = e => {
    const val = e.target.value;
    brightnessVal.textContent = val + '%';
    preview.style.filter = 'brightness('+val+'%)';
  };
  
  contrast.oninput = e => {
    const val = e.target.value;
    contrastVal.textContent = val + '%';
    preview.style.filter = 'brightness(100%) contrast('+val+'%)';
  };
})();
</script>
<style>
.studio-wrapper { max-width: 600px; margin: 2rem auto; text-align: center; }
.studio-preview { background: #fff; min-height: 200px; }
.studio-controls { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; max-width: 300px; margin-left: auto; margin-right: auto; }
.control-group { display: flex; align-items: center; justify-content: space-between; }
.control-group label { min-width: 60px; font-size: 0.8rem; }
</style></html>
