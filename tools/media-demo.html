<main id="main-content"><div class="container"><header class="project-hero"><p class="label">Accessible Media Player</p><h1>Media Player</h1><p>Play audio and video with full accessible controls. Free, open source.</p></header>
<section aria-labelledby="media-app-heading" class="media-app">
<h2 id="media-app-heading">Media Player</h2>
<div class="player-controls" role="region" aria-label="Media player controls">
  <div class="play-pause">
    <button class="btn btn-primary" id="play-pause" aria-label="Play">
      <i class="fa fa-play" aria-hidden="true"></i>
    </button>
    <button class="btn btn-primary" id="pause" aria-label="Pause" style="display:none;">
      <i class="fa fa-pause" aria-hidden="true"></i>
    </button>
  </div>
  <div class="time-display">
    <span id="time-current">00:00</span> / <span id="time-duration">00:00</span>
  </div>
  <input type="range" id="volume" aria-label="Volume" min="0" max="1" step="0.1" value="1">
  <span id="volume-value">100%</span>
  <br>
  <button class="btn btn-ghost" id="speed-slow" aria-label="0.5x speed">0.5x</button>
  <button class="btn btn-ghost active" id="speed-normal" aria-label="Normal speed">1x</button>
  <button class="btn btn-ghost" id="speed-fast" aria-label="2x speed">2x</button>
</div>
<audio id="media-player" controls class="demo-media" aria-label="Player"></audio>
<p class="section-action"><a href="../apps/media-player.html" class="btn btn-block">Download Full Media Player App →</a></p>
</section>
<script>
(() => {
  const media = $('#media-player');
  const playBtn = $('#play-pause');
  const pauseBtn = $('#pause');
  const timeCurrent = $('#time-current');
  const timeDuration = $('#time-duration');
  const volume = $('#volume');
  const volumeValue = $('#volume-value');
  const speedNormal = $('#speed-normal');
  const speedSlow = $('#speed-slow');
  const speedFast = $('#speed-fast');
  
  // Load sample or allow file select
  // For demo: play a short tone sequence
  const beep = (freq, duration) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = ctx.createOscillator();
    const gain = ctx.createGain();
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.frequency.value = freq;
    gain.gain.value = 0.1;
    oscillator.start(ctx.currentTime);
    oscillator.stop(ctx.currentTime + duration/1000);
  };
  
  // Play a simple melody on load
  setTimeout(() => {
    beep(261, 200); // C4
    beep(329, 200); // E4
    beep(392, 200); // G4
  }, 500);
  
  // Play/pause
  playBtn.onclick = () => { media.paused ? media.play() : media.pause(); playBtn.style.display = 'none'; pauseBtn.style.display = 'inline'; };
  pauseBtn.onclick = () => { media.pause(); playBtn.style.display = 'inline'; pauseBtn.style.display = 'none'; };
  
  // Volume
  volume.oninput = e => { media.volume = parseFloat(e.target.value); volumeValue.textContent = Math.round(media.volume * 100) + '%'; };
  
  // Speed controls
  speedNormal.onclick = () => { media.playbackRate = 1; updateSpeedButtons(); };
  speedSlow.onclick = () => { media.playbackRate = 0.5; updateSpeedButtons(); };
  speedFast.onclick = () => { media.playbackRate = 2; updateSpeedButtons(); };
  
  const updateSpeedButtons = () => {
    speedNormal.classList.toggle('active', media.playbackRate === 1);
    speedSlow.classList.toggle('active', media.playbackRate === 0.5);
    speedFast.classList.toggle('active', media.playbackRate === 2);
  };
  
  // Time display update
  media.ontimeupdate = () => {
    const mins = Math.floor(media.currentTime / 60);
    const secs = Math.floor(media.currentTime % 60);
    timeCurrent.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    // Try to get duration
    if(!isNaN(media.duration)) {
      const dMins = Math.floor(media.duration / 60);
      const dSecs = Math.floor(media.duration % 60);
      timeDuration.textContent = `${dMins}:${dSecs < 10 ? '0' : ''}${dSecs}`;
    }
  };
  
  // File input for real media
  const $ = id => document.getElementById(id);
  const fileInput = $('#media-file');
  if(fileInput) {
    fileInput.onchange = e => {
      const f = e.target.files[0];
      if(f) {
        URL.revoke(URL.createObjectURL(media.src));
        media.src = URL.createObjectURL(f);
        media.onloadeddata = () => {
          timeDuration.textContent = `${Math.floor(media.duration/60)}:${Math.floor(media.duration%60).toString().padStart(2,'0')}`;
        };
      }
    };
  }
})();
</script>
<style>
.player-controls { max-width: 600px; margin: 0 auto; }
.play-pause { margin-bottom: 1rem; }
.time-display { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; margin-bottom: 1rem; }
.time-current, .time-duration { min-width: 40px; }
.volume-row { margin: 1rem 0; display: flex; align-items: center; gap: 1rem; }
.speed-buttons { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
.speed-buttons .btn { flex: 1; }
</style></html>
