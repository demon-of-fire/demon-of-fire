<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Apps</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .link-container {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .app-link {
            display: block;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            border: 1px solid #ffffff;
            border-radius: 8px;
            font-weight: bold;
        }

        .app-link:hover {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="link-container">
        <a href="#" class="app-link">App Name One</a>
        <a href="#" class="app-link">App Name Two</a>
        <a href="#" class="app-link">App Name Three</a>
    </div>

</body>
</html>
