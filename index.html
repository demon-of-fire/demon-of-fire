<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio featuring Accessible Studio - The Accessible Video Editor">
    <title>My Apps</title>
    <style>
        :root {
            /* Using CSS variables for easier theme management */
            --bg-color: #0f172a; 
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --hover-bg: #1e293b;
            --border-radius: 12px;
            --transition-speed: 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            /* System fonts look cleaner and load instantly */
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        main {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        header {
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2rem;
        }

        p.subtitle {
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }

        .link-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .app-link {
            display: flex;
            flex-direction: column;
            padding: 20px;
            text-decoration: none;
            color: var(--text-color);
            border: 2px solid var(--accent-color);
            border-radius: var(--border-radius);
            transition: background-color var(--transition-speed), transform var(--transition-speed);
        }

        .app-link span.app-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .app-link span.app-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* Improved focus and hover states for accessibility */
        .app-link:hover, .app-link:focus-visible {
            background-color: var(--hover-bg);
            transform: translateY(-2px);
            outline: none;
        }

        .app-link:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <main>
        <header>
            <h1>My Apps</h1>
            <p class="subtitle">Tools built with accessibility in mind.</p>
        </header>

        <nav class="link-container" aria-label="Applications">
            <a href="#" class="app-link">
                <span class="app-name">Accessible Studio</span>
                <span class="app-desc">An Accessible Video Editor</span>
            </a>
        </nav>
    </main>

</body>
</html>
